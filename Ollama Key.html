<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ollama License Key Generator</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #111418;
    --border: #23282f;
    --text: #d8dee4;
    --muted: #6b7684;
    --accent: #10b981;
    --accent-dim: #0b7a56;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    overflow-x: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 20px;
  }
  .window {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #15181d;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .titlebar span.name { margin-left: 6px; }

  .content {
    padding: 22px 20px 26px;
    font-size: 14px;
    line-height: 1.6;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .brand .logo {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, #1f2328, #0b0d10);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: var(--accent);
  }
  .brand h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
    color: #fff;
  }
  .brand .ver {
    font-size: 12px;
    color: var(--muted);
  }

  #log {
    white-space: pre-wrap;
    min-height: 150px;
    color: var(--text);
  }
  #log .ok { color: var(--accent); }
  #log .dim { color: var(--muted); }

  .barWrap {
    margin-top: 14px;
    background: #1a1e24;
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 10px;
    overflow: hidden;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-dim), var(--accent));
    transition: width 0.25s linear;
  }
  .pct {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }

  .keyBox {
    margin-top: 16px;
    padding: 12px 14px;
    background: #0e1115;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent);
    font-size: 14px;
    letter-spacing: 1px;
    display: none;
  }
  .keyBox.show { display: block; }

  button#genBtn {
    appearance: none;
    border: 1px solid var(--accent-dim);
    width: 100%;
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: 7px;
    background: #0e1115;
    color: var(--accent);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button#genBtn:hover { background: #121720; }
  button#genBtn:disabled { opacity: 0.6; cursor: default; }

  /* Jumpscare overlay */
  #scare {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #scare.show { display: flex; }
  #scare img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    animation: flashZoom 0.25s ease-out;
  }
  @keyframes flashZoom {
    0%   { transform: scale(1.4); filter: brightness(3); }
    40%  { transform: scale(1.08); filter: brightness(1.6); }
    100% { transform: scale(1); filter: brightness(1); }
  }
</style>
</head>

  </audio>

<script>
  const genBtn    = document.getElementById('genBtn');
  const logEl     = document.getElementById('log');
  const bar       = document.getElementById('bar');
  const pctEl     = document.getElementById('pct');
  const keyBox    = document.getElementById('keyBox');
  const scare     = document.getElementById('scare');
  const scareAudio= document.getElementById('scareAudio');

  let triggered = false;

  const steps = [
    "Подключение к серверу лицензий...",
    "Проверка активации Ollama...",
    "Сбор параметров системы...",
    "Генерация ключа шифрования...",
    "Подпись лицензии...",
    "Финальная проверка..."
  ];

  function randomKey() {
    const seg = () => Math.random().toString(36).substring(2, 6).toUpperCase();
    return `OLLAMA-${seg()}-${seg()}-${seg()}-${seg()}`;
  }

  genBtn.addEventListener('click', () => {
    if (triggered) return;
    triggered = true;
    genBtn.disabled = true;
    genBtn.textContent = 'Генерация...';
    logEl.innerHTML = '';

    const totalMs = 6000;
    const stepMs = totalMs / steps.length;

    steps.forEach((text, i) => {
      setTimeout(() => {
        const line = document.createElement('div');
        line.innerHTML = '<span class="ok">[OK]</span> ' + text;
        logEl.appendChild(line);
      }, i * stepMs);
    });

    // Progress bar over 6 seconds
    const start = Date.now();
    const timer = setInterval(() => {
      const elapsed = Date.now() - start;
      const pct = Math.min(100, Math.round((elapsed / totalMs) * 100));
      bar.style.width = pct + '%';
      pctEl.textContent = pct + '%';
      if (pct >= 100) clearInterval(timer);
    }, 80);

    // Jumpscare appears 6 seconds after clicking generate
    setTimeout(() => {
      scare.classList.add('show');
      try {
        scareAudio.currentTime = 0;
        const p = scareAudio.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {}

      // Jumpscare lasts 5 seconds, then it disappears
      setTimeout(() => {
        scare.classList.remove('show');
        scareAudio.pause();
        scareAudio.currentTime = 0;

        const line = document.createElement('div');
        line.innerHTML = '<span class="dim">Это был просто розыгрыш 😄</span>';
        logEl.appendChild(line);

        genBtn.disabled = false;
        genBtn.textContent = 'Сгенерировать ещё раз';
        keyBox.classList.remove('show');
        bar.style.width = '0%';
        pctEl.textContent = '0%';
        triggered = false;
      }, 5000);

    }, 6000);
  });
</script>
